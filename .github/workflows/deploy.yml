name: Deploy Database to Azure SQL

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Install sqlpackage
      run: dotnet tool install -g microsoft.sqlpackage

    - name: Build DACPAC
      run: msbuild powdernaut.database/powdernaut.database.sqlproj /p:Configuration=Release

    - name: Get runner IP
      id: ip
      run: |
        $ip = (Invoke-RestMethod -Uri "https://api.ipify.org")
        echo "RUNNER_IP=$ip" >> $env:GITHUB_ENV
        echo "ip=$ip" >> $env:GITHUB_OUTPUT

    - name: Log in to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Add runner IP to Azure SQL firewall
      run: |
        az sql server firewall-rule create `
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} `
          --server ${{ secrets.AZURE_SQL_SERVER }} `
          --name "GitHubActions-${{ github.run_id }}" `
          --start-ip-address ${{ env.RUNNER_IP }} `
          --end-ip-address ${{ env.RUNNER_IP }}

    - name: Publish to Azure SQL
      run: sqlpackage /Action:Publish /SourceFile:"powdernaut.database\bin\Release\powdernaut.database.dacpac" /TargetConnectionString:"${{ secrets.AZURE_SQL_CONNECTION_STRING }}"

    - name: Remove runner IP from Azure SQL firewall
      if: always()
      run: |
        az sql server firewall-rule delete `
          --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} `
          --server ${{ secrets.AZURE_SQL_SERVER }} `
          --name "GitHubActions-${{ github.run_id }}"
